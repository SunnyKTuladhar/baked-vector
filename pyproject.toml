[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "baked-vector"
version = "0.2.0"
description = "Zero-dependency vector store for small-scale embedding search."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

[project.urls]
Repository = "https://github.com/sunnytuladhar/baked-vector"

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
openai = ["openai>=1.0"]
bedrock = ["boto3>=1.34"]
google = ["google-generativeai>=0.8"]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
