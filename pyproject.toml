[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baked-vector"
version = "0.2.0"
description = "Zero-dependency vector store for small-scale embedding search."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["vector", "embedding", "search", "rag", "bm25", "semantic-search", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/SunnyKTuladhar/baked-vector"
Repository = "https://github.com/SunnyKTuladhar/baked-vector"
Issues = "https://github.com/SunnyKTuladhar/baked-vector/issues"

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
openai = ["openai>=1.0"]
bedrock = ["boto3>=1.34"]
google = ["google-generativeai>=0.8"]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
